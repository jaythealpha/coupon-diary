# 아이콘 원본은 assets/branding/app_icon.png 이고,
# 그 파일은 assets/branding/make_icon.py 로 다시 만들 수 있다.
# 재생성: python3 assets/branding/make_icon.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"

  android: "ic_launcher"
  # 적응형 아이콘: 배경은 브랜드 단색, 전경은 티켓만 남긴 이미지.
  # 원본을 그대로 전경으로 쓰면 런처가 잘라낼 때 티켓이 잘린다.
  adaptive_icon_background: "#1D4ED8"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

  ios: true
  # iOS 아이콘에는 알파 채널이 있으면 안 된다.
  remove_alpha_ios: true

  web:
    generated: false
