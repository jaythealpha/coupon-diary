name: Android APK

# 로컬에 Android Studio도 SDK도 깔지 않고 실기기 테스트용 APK를 얻는다.
# GitHub 서버(ubuntu)가 대신 빌드하고, Actions 탭에서 파일을 내려받아
# 안드로이드 폰에 그대로 설치하면 된다. Play Console 계정도 필요 없다.
on:
  push:
    branches: [main]
  workflow_dispatch:        # 탭에서 손으로도 돌릴 수 있게

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - run: flutter pub get

      # 로컬에서 통과한 것과 같은 검사를 서버에서도 돌린다.
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      # key.properties가 없으면 디버그 서명으로 떨어진다(build.gradle.kts 분기).
      # 사이드로드 테스트에는 그걸로 충분하다. 스토어 제출용은 별도.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: coupon-diary-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
